[workspace]
resolver = "3"
members = ["crates/domain", "crates/storage", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Vianpyro/smart-cooking"
publish = false

# Real per-crate dependencies are wired in as `{ workspace = true }` when the
# code that needs them is written. Versions are resolved here first via
# `cargo add --dry-run` so no version number is ever typed from memory.
[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "time",
    "macros",
    "migrate",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
