services:
  app:
    build:
      # Relative paths in a merged override file resolve against the first
      # -f file's directory (the repo root here), not this file's own
      # directory - so this is the repo root, not .devcontainer/'s parent.
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    environment:
      # Service names, not localhost: this container is a compose peer of
      # postgres/object-storage, not the host running compose.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
